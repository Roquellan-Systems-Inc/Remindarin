services:
  - type: web
    name: remindarin-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "cd Backend && pip install --upgrade pip && pip install -r requirements.txt --no-cache-dir"
    startCommand: "cd Backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: remindarin-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_SUB
        value: mailto:dev@remindarin.com
      - key: CRON_SECRET
        sync: false

databases:
  - name: remindarin-db
    plan: free
    region: singapore
    databaseName: remindarin
    user: remindarin_user